name: IPSA Yahoo (cierre diario)

# Días hábiles a las 21:37 UTC (18:37 Chile en verano, 17:37 en invierno), después
# del cierre de la bolsa: guarda el cierre del IPSA de Yahoo (^767564-CLP-GRTR; respaldo MXIPSAGC.SN) en
# data/ipsa_yahoo.csv. Es la fuente del IPSA del Pulso para los días que el BCCh
# aún no publica: la usan el dashboard (R/preparar.R), la actualización diaria
# (scripts/actualizar_datos.R) y el correo diario. También manual.
on:
  schedule:
    - cron: '37 21 * * 1-5'
  workflow_dispatch:

concurrency:
  group: pulso-ipsa-yahoo
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ipsa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cierre del IPSA en Yahoo
        run: python3 .github/scripts/ipsa_yahoo.py

      - name: Commit
        run: .github/scripts/commit-datos.sh "IPSA Yahoo ($(date -u +%Y-%m-%d))" data/ipsa_yahoo.csv
