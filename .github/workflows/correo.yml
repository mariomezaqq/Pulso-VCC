name: Correo diario Pulso

# Arma el correo diario del Pulso (texto en el formato de correo de la AFI + Excel
# adjunto: el reporte es el link al Pulso) con las mismas cifras del dashboard, lo deja como "artifact" y lo muestra
# en el resumen. Con enviar=true lo envía por Microsoft Graph desde la cuenta de
# Mario (app de Azure del dashboard de la AFI; secrets AZURE_TENANT_ID,
# AZURE_CLIENT_ID, AZURE_REFRESH_TOKEN y los destinatarios CORREO_PARA / CORREO_CC).
# Lo dispara el programador de Supabase (proyecto "Pulso VCC") a las 17:30 de Chile de
# lunes a viernes, con enviar=true; también se puede correr a mano. Si los datos están
# atrasados NO se envía al equipo: se avisa solo a CORREO_AVISO.
on:
  workflow_dispatch:
    inputs:
      enviar:
        description: "Enviar el correo (false = solo armarlo y mostrarlo)"
        type: boolean
        default: false
      forzar:
        description: "Enviar al equipo aunque los datos estén atrasados"
        type: boolean
        default: false
      solo_a:
        description: "Pruebas: enviar SOLO a esta dirección (ignora CORREO_PARA y CORREO_CC)"
        type: string
        required: false

concurrency:
  group: pulso-correo
  cancel-in-progress: false

permissions:
  contents: write   # solo si hay que actualizar los datos antes de armar el correo

jobs:
  correo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CMF_RECAPTCHA_TOKEN: ${{ secrets.CMF_RECAPTCHA_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup R
        id: setup_r
        uses: r-lib/actions/setup-r@v2
        timeout-minutes: 6
        continue-on-error: true
        with:
          use-public-rspm: true

      # Si el primer intento se cuelga y lo corta el timeout, deja apt a medias (candado de dpkg):
      # sin esta limpieza el reintento falla en 2 s con "exit code 100" (pasó el 10-11).
      - name: Limpiar apt antes del reintento
        if: steps.setup_r.outcome == 'failure'
        run: |
          sudo pkill -9 -x apt-get || true
          sudo pkill -9 -x apt || true
          sudo pkill -9 -x dpkg || true
          sudo rm -f /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock /var/lib/apt/lists/lock /var/cache/apt/archives/lock
          sudo dpkg --configure -a || true

      - name: Setup R (reintento)
        if: steps.setup_r.outcome == 'failure'
        uses: r-lib/actions/setup-r@v2
        timeout-minutes: 8
        with:
          use-public-rspm: true

      - name: Instalar paquetes R
        run: |
          install.packages(c("httr","rvest","dplyr","tidyr","stringr","lubridate","tibble",
                             "jsonlite","quantmod","readxl","openxlsx"))
        shell: Rscript {0}

      # El correo sale con los datos del día: si la actualización completa de hoy
      # (hora de Chile) todavía no corrió, se hace aquí antes de armarlo.
      - name: ¿Datos de hoy?
        id: datos
        run: |
          d <- readRDS("data/series_vc.rds"); ult <- d$completo
          if (is.null(ult)) ult <- d$generado
          hoy <- format(as.POSIXlt(Sys.time(), tz = "America/Santiago"), "%Y-%m-%d")
          al_dia <- !is.null(ult) && substr(ult, 1, 10) >= hoy
          message("Última actualización completa: ", ult, " | hoy en Chile: ", hoy, " | al día: ", al_dia)
          cat(sprintf("al_dia=%s\n", tolower(al_dia)), file = Sys.getenv("GITHUB_OUTPUT"), append = TRUE)
        shell: Rscript {0}

      - name: Actualizar datos (solo si faltaba)
        if: steps.datos.outputs.al_dia != 'true'
        run: |
          options(timeout = 600)
          source("scripts/actualizar_datos.R")
        shell: Rscript {0}

      - name: Commit de los datos actualizados
        if: steps.datos.outputs.al_dia != 'true' && github.ref_name == 'main'
        run: .github/scripts/commit-datos.sh "Actualización automática de datos ($(date -u +%Y-%m-%d))" data/series_vc.rds

      - name: Armar el correo
        run: Rscript scripts/correo_diario.R correo

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enviar el correo (o dry-run)
        env:
          SEND: ${{ inputs.enviar && 'true' || 'false' }}
          CORREO_SOLO_A: ${{ inputs.solo_a }}
          FORZAR: ${{ inputs.forzar && 'true' || 'false' }}
          CORREO_AVISO: ${{ secrets.CORREO_AVISO }}
          CORREO_PARA: ${{ secrets.CORREO_PARA }}
          CORREO_CC: ${{ secrets.CORREO_CC }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_REFRESH_TOKEN: ${{ secrets.AZURE_REFRESH_TOKEN }}
        run: node scripts/enviar_correo.mjs correo

      # Microsoft renueva el refresh token en cada uso: se guarda el nuevo (si no, caduca a los 90 días)
      - name: Rotar refresh token
        if: always() && hashFiles('.new-refresh-token') != ''
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_SECRETS }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::Falta GH_PAT_SECRETS; el refresh token no se rotó."
          else
            gh secret set AZURE_REFRESH_TOKEN --repo "$GITHUB_REPOSITORY" < .new-refresh-token
            echo "Refresh token rotado."
          fi
          rm -f .new-refresh-token

      # El aviso de "primer envio" (correo_assets/primer_envio.txt) solo va una vez: tras el primer envio
      # real al equipo (no prueba, no aviso de datos atrasados) se borra del repo.
      - name: Retirar el aviso de primer envío
        if: inputs.enviar == true && inputs.solo_a == '' && github.ref_name == 'main' && hashFiles('correo_assets/primer_envio.txt') != ''
        run: |
          if python3 -c "import json,sys;sys.exit(0 if json.load(open('correo/meta.json')).get('atrasado') is not True or '${{ inputs.forzar }}' == 'true' else 1)"; then
            git rm -q correo_assets/primer_envio.txt
            .github/scripts/commit-datos.sh "Correo: primer envío realizado, se retira el aviso" correo_assets/primer_envio.txt
          fi

      - name: Resumen (vista previa)
        run: |
          {
            echo "## $(cat correo/asunto.txt)"
            echo
            python3 -c "import json;a=json.load(open('correo/meta.json'))['avisos'];a=[a] if isinstance(a,str) else a;print(''.join('\n> ⚠ '+x+'\n' for x in a))"
            echo
            tail -n +2 correo/cuerpo.txt
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar el correo generado
        uses: actions/upload-artifact@v4
        with:
          name: correo-pulso
          path: correo/
          retention-days: 14
