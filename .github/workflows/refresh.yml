name: Actualizar datos Pulso VCC

# Corre todos los días a las 11:00 hora de Chile, todo el año. GitHub programa en
# UTC y Chile cambia de horario, así que hay dos horarios (14:00 y 15:00 UTC) y el
# job "hora" deja pasar solo el que ese día cae a las 11:00 en Chile:
#   verano (UTC-3): 14:00 UTC = 11:00   |   invierno (UTC-4): 15:00 UTC = 11:00
# También se puede disparar a mano desde la pestaña Actions ("Run workflow").
on:
  schedule:
    - cron: '0 14 * * *'
    - cron: '0 15 * * *'
  workflow_dispatch:
    inputs:
      solo_fondos:
        description: "Solo estos fondos (run-serie separados por coma, ej. 9152-A). Vacío = todos."
        required: false
        default: ""

# Una corrida a la vez (las que llegan esperan su turno, no se pisan)
concurrency:
  group: pulso-refresh
  cancel-in-progress: false

permissions:
  contents: write   # para commitear data/series_vc.rds de vuelta al repo

jobs:
  hora:
    runs-on: ubuntu-latest
    outputs:
      correr: ${{ steps.h.outputs.correr }}
    steps:
      - id: h
        # Decide por el horario que disparo la corrida (no por la hora real, que
        # puede atrasarse): 14:00 UTC solo con Chile en UTC-3, 15:00 UTC solo en UTC-4.
        run: |
          off=$(TZ=America/Santiago date +%z)
          case "${{ github.event_name }}|${{ github.event.schedule }}|$off" in
            workflow_dispatch*) correr=true ;;
            "schedule|0 14 * * *|-0300") correr=true ;;
            "schedule|0 15 * * *|-0400") correr=true ;;
            *) correr=false ;;
          esac
          echo "Chile UTC$off, disparo '${{ github.event.schedule }}' -> correr=$correr"
          echo "correr=$correr" >> "$GITHUB_OUTPUT"

  scrape:
    needs: hora
    if: needs.hora.outputs.correr == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30   # si algo se cuelga (ej. instalar R), falla en vez de quedar horas
    env:
      CMF_RECAPTCHA_TOKEN: ${{ secrets.CMF_RECAPTCHA_TOKEN }}
      SOLO_FONDOS: ${{ github.event.inputs.solo_fondos }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # "Setup R" a veces se cuelga en el runner de GitHub (pasó 2 veces el
      # 26-10, >15 min; lo normal es <1 min): tope de 6 min y un reintento.
      - name: Setup R
        id: setup_r
        uses: r-lib/actions/setup-r@v2
        timeout-minutes: 6
        continue-on-error: true
        with:
          use-public-rspm: true

      - name: Setup R (reintento)
        if: steps.setup_r.outcome == 'failure'
        uses: r-lib/actions/setup-r@v2
        timeout-minutes: 8
        with:
          use-public-rspm: true

      - name: Instalar paquetes R
        run: |
          install.packages(c("httr","rvest","dplyr","tidyr","stringr",
                             "lubridate","tibble","jsonlite","quantmod","readxl"))
        shell: Rscript {0}

      - name: Scrapear y generar data/series_vc.rds
        run: |
          options(timeout = 600)
          setwd(".")
          source("scripts/actualizar_datos.R")
        shell: Rscript {0}

      - name: Completar rent 2024/2025 de fondos nuevos (del valor cuota)
        continue-on-error: true   # secundario: si falla, NO debe frenar el commit diario
        run: |
          options(timeout = 600)
          setwd(".")
          source("scripts/completar_rentabilidades.R")
        shell: Rscript {0}

      - name: Commit del artefacto actualizado
        run: .github/scripts/commit-datos.sh "Actualización automática de datos ($(date -u +%Y-%m-%d))" data/series_vc.rds data/fondos_curados.csv
