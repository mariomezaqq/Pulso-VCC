name: Actualizar datos Pulso VCC
# Las corridas de "un solo fondo" (agregar fondo en el panel) llevan otro nombre:
# hora_refresh.sh no las cuenta como la actualizacion completa del dia.
run-name: ${{ github.event.inputs.solo_fondos && format('Solo fondo {0}', github.event.inputs.solo_fondos) || 'Actualizar datos Pulso VCC' }}

# Actualiza todos los días a partir de las 11:00 de Chile. GitHub atrasa los cron
# varias horas (el de las 11:00 corria a las 14-17 h), así que se programa cada
# hora (minuto :17, fuera de la hora en punto que GitHub más atrasa) y el job
# "hora" (.github/scripts/hora_refresh.sh) deja pasar solo la primera corrida
# que llega después de las 11:00 si hoy aún no se actualizó; las demás se saltan
# en segundos. 13-21 UTC = 10:17-18:17 Chile en verano, 09:17-17:17 en invierno.
# También se puede disparar a mano desde Actions o el botón del panel.
on:
  schedule:
    - cron: '17 13-21 * * *'
  workflow_dispatch:
    inputs:
      solo_fondos:
        description: "Solo estos fondos (run-serie separados por coma, ej. 9152-A). Vacío = todos."
        required: false
        default: ""
      reintento:
        description: "Lo usa Supabase (1 a 4: 11:30, 12:00, 12:30, 13:00). Corre solo para los fondos sin NAV de hoy. Vacío = normal."
        required: false
        default: ""

# Una corrida a la vez (las que llegan esperan su turno, no se pisan)
concurrency:
  group: pulso-refresh
  cancel-in-progress: false

permissions:
  contents: write   # para commitear data/series_vc.rds de vuelta al repo
  actions: read     # hora_refresh.sh revisa si ya hubo una actualizacion hoy

jobs:
  hora:
    runs-on: ubuntu-latest
    outputs:
      correr: ${{ steps.h.outputs.correr }}
      solo: ${{ steps.h.outputs.solo }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/scripts
            data/faltantes_nav.txt
      - id: h
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/hora_refresh.sh "${{ github.event_name }}" "${{ github.event.inputs.reintento }}" >> "$GITHUB_OUTPUT"

  scrape:
    needs: hora
    if: needs.hora.outputs.correr == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30   # si algo se cuelga (ej. instalar R), falla en vez de quedar horas
    env:
      CMF_RECAPTCHA_TOKEN: ${{ secrets.CMF_RECAPTCHA_TOKEN }}
      SOLO_FONDOS: ${{ needs.hora.outputs.solo || github.event.inputs.solo_fondos }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # El espejo apt de Azure (azure.archive.ubuntu.com) a veces cae (503) y "Setup R" se cuelga hasta el timeout
      # (11-11: el refresh de las 11:00 fallo 4 veces). Aqui se elige un espejo que SI responda y, si ninguno
      # lo hace, se falla en segundos con un mensaje claro en vez de gastar 14 minutos (los reintentos de las
      # 11:30 a 13:00 y el cron de respaldo lo vuelven a intentar).
      - name: Espejo de apt confiable
        run: |
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "20";\n' | sudo tee /etc/apt/apt.conf.d/99pulso >/dev/null
          ok() { curl -fsI -m 8 "$1/dists/noble/InRelease" >/dev/null 2>&1; }
          if ok http://azure.archive.ubuntu.com/ubuntu; then echo "Espejo de Azure OK"
          elif ok http://archive.ubuntu.com/ubuntu; then
            echo "Espejo de Azure caido: se usa archive.ubuntu.com"
            echo "http://archive.ubuntu.com/ubuntu/" | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          else
            echo "::error::Ningun espejo de apt responde (caida externa de Ubuntu/Azure): no se puede instalar R. Se reintentara solo."
            exit 1
          fi

      # "Setup R" a veces se cuelga en el runner de GitHub (pasó 2 veces el
      # 26-10, >15 min; lo normal es <1 min): tope de 6 min y un reintento.
      - name: Setup R
        id: setup_r
        uses: r-lib/actions/setup-r@v2
        timeout-minutes: 6
        continue-on-error: true
        with:
          use-public-rspm: true

      # Si el primer intento se cuelga y lo corta el timeout, deja apt a medias (candado de dpkg):
      # sin esta limpieza el reintento falla en 2 s con "exit code 100" (pasó el 10-11).
      - name: Limpiar apt antes del reintento
        if: steps.setup_r.outcome == 'failure'
        run: |
          sudo pkill -9 -x apt-get || true
          sudo pkill -9 -x apt || true
          sudo pkill -9 -x dpkg || true
          sudo rm -f /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock /var/lib/apt/lists/lock /var/cache/apt/archives/lock
          sudo dpkg --configure -a || true

      - name: Setup R (reintento)
        if: steps.setup_r.outcome == 'failure'
        uses: r-lib/actions/setup-r@v2
        timeout-minutes: 8
        with:
          use-public-rspm: true

      - name: Instalar paquetes R
        run: |
          install.packages(c("httr","rvest","dplyr","tidyr","stringr",
                             "lubridate","tibble","jsonlite","quantmod","readxl"))
        shell: Rscript {0}

      - name: Scrapear y generar data/series_vc.rds
        run: |
          options(timeout = 600)
          setwd(".")
          source("scripts/actualizar_datos.R")
        shell: Rscript {0}

      - name: Completar rent 2024/2025 de fondos nuevos (del valor cuota)
        continue-on-error: true   # secundario: si falla, NO debe frenar el commit diario
        run: |
          options(timeout = 600)
          setwd(".")
          source("scripts/completar_rentabilidades.R")
        shell: Rscript {0}

      # Deja en data/faltantes_nav.txt los fondos que aun no tienen el NAV del dia habil anterior:
      # los reintentos de las 11:30 a las 13:00 corren solo para ellos (ver hora_refresh.sh).
      - name: Fondos que aún no tienen el NAV
        continue-on-error: true
        run: Rscript scripts/faltantes_nav.R

      - name: Commit del artefacto actualizado
        run: .github/scripts/commit-datos.sh "Actualización automática de datos ($(date -u +%Y-%m-%d))" data/series_vc.rds data/fondos_curados.csv data/faltantes_nav.txt
