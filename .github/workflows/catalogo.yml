name: Actualizar catálogo de fondos CMF

# Una vez al mes (día 2, 13:07 UTC ≈ 10:07 Chile) reescribe el catálogo del
# buscador del panel (fondos/data/catalogo_fondos_limpio.csv) con los fondos y
# series vigentes de la CMF. Al commitearlo, deploy.yml republica la app
# (toca fondos/data/) y el buscador queda al día. También manual desde Actions.
on:
  schedule:
    - cron: '7 13 2 * *'
  workflow_dispatch:

concurrency:
  group: pulso-catalogo
  cancel-in-progress: false

permissions:
  contents: write
  actions: write   # para lanzar deploy.yml al final

jobs:
  catalogo:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # El espejo apt de Azure (azure.archive.ubuntu.com) a veces cae (503) y "Setup R" se cuelga hasta el timeout
      # (11-11: el refresh de las 11:00 fallo 4 veces). Aqui se elige un espejo que SI responda y, si ninguno
      # lo hace, se falla en segundos con un mensaje claro en vez de gastar 14 minutos (los reintentos de las
      # 11:30 a 13:00 y el cron de respaldo lo vuelven a intentar).
      - name: Espejo de apt confiable
        run: |
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "20";\n' | sudo tee /etc/apt/apt.conf.d/99pulso >/dev/null
          ok() { curl -fsI -m 8 "$1/dists/noble/InRelease" >/dev/null 2>&1; }
          if ok http://azure.archive.ubuntu.com/ubuntu; then echo "Espejo de Azure OK"
          elif ok http://archive.ubuntu.com/ubuntu; then
            echo "Espejo de Azure caido: se usa archive.ubuntu.com"
            echo "http://archive.ubuntu.com/ubuntu/" | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          else
            echo "::error::Ningun espejo de apt responde (caida externa de Ubuntu/Azure): no se puede instalar R. Se reintentara solo."
            exit 1
          fi

      # "Setup R" a veces se cuelga en el runner de GitHub: tope de 6 min y un reintento.
      - name: Setup R
        id: setup_r
        uses: r-lib/actions/setup-r@v2
        timeout-minutes: 6
        continue-on-error: true
        with:
          use-public-rspm: true

      # Si el primer intento se cuelga y lo corta el timeout, deja apt a medias (candado de dpkg):
      # sin esta limpieza el reintento falla en 2 s con "exit code 100" (pasó el 10-11).
      - name: Limpiar apt antes del reintento
        if: steps.setup_r.outcome == 'failure'
        run: |
          sudo pkill -9 -x apt-get || true
          sudo pkill -9 -x apt || true
          sudo pkill -9 -x dpkg || true
          sudo rm -f /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock /var/lib/apt/lists/lock /var/cache/apt/archives/lock
          sudo dpkg --configure -a || true

      - name: Setup R (reintento)
        if: steps.setup_r.outcome == 'failure'
        uses: r-lib/actions/setup-r@v2
        timeout-minutes: 8
        with:
          use-public-rspm: true

      - name: Instalar paquetes R
        run: install.packages(c("httr", "xml2"))
        shell: Rscript {0}

      - name: Leer fondos y series vigentes de la CMF
        run: Rscript scripts/actualizar_catalogo.R

      - name: Commit del catálogo
        run: .github/scripts/commit-datos.sh "Catálogo de fondos CMF actualizado ($(date -u +%Y-%m-%d))" fondos/data/catalogo_fondos_limpio.csv

      # El commit del bot (GITHUB_TOKEN) no dispara deploy.yml por push: se lanza
      # a mano para que el buscador de la app tome el catalogo nuevo.
      - name: Republicar la app
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main --repo "$GITHUB_REPOSITORY"
