name: Dashboard estático (GitHub Pages)

# Genera index.html (el Pulso ya calculado) y lo commitea; GitHub Pages lo publica en
# https://mariomezaqq.github.io/Pulso-VCC/ y abre al instante, sin esperar a que arranque R.
# Se regenera cada vez que cambian los datos o el código del dashboard:
#   - push a main que toque los datos (ediciones del panel de administración, boletín, etc.)
#   - al terminar con éxito la actualización diaria, los dividendos, el IPSA o el catálogo
#     (los commits del bot no disparan "push", por eso se usa workflow_run)
# Si el resultado es idéntico al anterior no hace commit.
on:
  push:
    branches: [main]
    paths:
      - 'data/manuales_vc.csv'
      - 'data/fondos_curados.csv'
      - 'data/dividendos_overrides.csv'
      - 'data/dividendos.xlsx'
      - 'data/series_vc.rds'
      - 'R/**'
      - 'scripts/generar_dashboard.R'
      - 'www/logo.jpg'
      - '.github/workflows/dashboard.yml'
  workflow_run:
    workflows:
      - "Actualizar datos Pulso VCC"
      - "Calcular dividendos del Boletin (incl. monto total)"
      - "IPSA Yahoo (cierre diario)"
    types: [completed]
  workflow_dispatch:

concurrency:
  group: pulso-dashboard
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  dashboard:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # El espejo apt de Azure (azure.archive.ubuntu.com) a veces cae (503) y "Setup R" se cuelga hasta el timeout
      # (11-11: el refresh de las 11:00 fallo 4 veces). Aqui se elige un espejo que SI responda y, si ninguno
      # lo hace, se falla en segundos con un mensaje claro en vez de gastar 14 minutos (los reintentos de las
      # 11:30 a 13:00 y el cron de respaldo lo vuelven a intentar).
      - name: Espejo de apt confiable
        run: |
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "20";\n' | sudo tee /etc/apt/apt.conf.d/99pulso >/dev/null
          ok() { curl -fsI -m 8 "$1/dists/noble/InRelease" >/dev/null 2>&1; }
          if ok http://azure.archive.ubuntu.com/ubuntu; then echo "Espejo de Azure OK"
          elif ok http://archive.ubuntu.com/ubuntu; then
            echo "Espejo de Azure caido: se usa archive.ubuntu.com"
            echo "http://archive.ubuntu.com/ubuntu/" | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          else
            echo "::error::Ningun espejo de apt responde (caida externa de Ubuntu/Azure): no se puede instalar R. Se reintentara solo."
            exit 1
          fi

      - name: Setup R
        id: setup_r
        uses: r-lib/actions/setup-r@v2
        timeout-minutes: 6
        continue-on-error: true
        with:
          use-public-rspm: true

      # Si el primer intento se cuelga y lo corta el timeout, deja apt a medias (candado de dpkg):
      # sin esta limpieza el reintento falla en 2 s con "exit code 100" (pasó el 10-11).
      - name: Limpiar apt antes del reintento
        if: steps.setup_r.outcome == 'failure'
        run: |
          sudo pkill -9 -x apt-get || true
          sudo pkill -9 -x apt || true
          sudo pkill -9 -x dpkg || true
          sudo rm -f /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock /var/lib/apt/lists/lock /var/cache/apt/archives/lock
          sudo dpkg --configure -a || true

      - name: Setup R (reintento)
        if: steps.setup_r.outcome == 'failure'
        uses: r-lib/actions/setup-r@v2
        timeout-minutes: 8
        with:
          use-public-rspm: true

      - name: Instalar paquetes R
        run: install.packages(c("httr", "dplyr", "lubridate", "tibble", "jsonlite", "readxl", "openxlsx", "stringr", "tidyr"))
        shell: Rscript {0}

      - name: Generar index.html
        run: Rscript scripts/generar_dashboard.R index.html

      - name: Commit
        run: .github/scripts/commit-datos.sh "Dashboard estático ($(date -u +%Y-%m-%d))" index.html
